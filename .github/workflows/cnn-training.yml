name: CNN Training

on:
  push:
    branches: [main, improve-cifar10-generalization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Train and evaluate CNN
        run: |
          set -o pipefail
          python main.py 2>&1 | tee training.log

      - name: Save training output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnn-training-output
          path: |
            training.log
            models/cnn_model.pth
          if-no-files-found: warn
          retention-days: 14
