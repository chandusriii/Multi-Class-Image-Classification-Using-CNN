name: CNN Training and Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cnn-training-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-train:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify PyTorch runtime
        run: |
          python -c "import torch, torchvision; print('PyTorch:', torch.__version__); print('Torchvision:', torchvision.__version__); print('CUDA available:', torch.cuda.is_available())"

      - name: Test CNN forward pass
        run: python -m unittest discover -s tests -v

      - name: Download CIFAR-10, train for 10 epochs, and evaluate
        run: |
          set -o pipefail
          python main.py 2>&1 | tee training.log

      - name: Upload training log and model checkpoint
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cnn-training-results
          path: |
            training.log
            models/cnn_model.pth
          if-no-files-found: warn
          retention-days: 14
